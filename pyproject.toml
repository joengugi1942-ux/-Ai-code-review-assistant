[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-assistant"
version = "0.1.0"
description = "Backend API for an AI-powered code review assistant."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "groq>=0.4.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.30.0",
    "aiomysql>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["app", "app.ai", "app.api", "app.api.v1", "app.core", "app.db", "app.schemas", "app.services", "app.tests", "app.utils", "app.pipelines"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
